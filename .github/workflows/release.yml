name: Release VRCDog

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的 tag 时触发，例如 v5.0.1

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest] # 我们目前只针对 Windows 打包

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.10.0
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.VRCDOG_RELEASES_TOKEN }}
          # 用于自动更新包的签名。
          # VRCDOG_RELEASES_TOKEN 是有 public_repo 权限的 PAT，用于把 release 推到跨仓库 vrcdog-releases。
          # TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD 用于签名 updater.json。
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }} # 使用触发该工作流的 tag 作为版本号
          releaseName: 'VRCDog ${{ github.ref_name }}'
          releaseBody: |
            ## VRCDog 更新发布
            有关此版本的详细更新内容，请参阅提交历史。
            
            如果使用安装包，请下载 `VRCDog_x.x.x_x64_zh-CN.msi`。
            如果有疑问，请加入我们的交流群。
          releaseDraft: false
          prerelease: false
          # 把 release / updater.json / 安装包推到专门的发版仓 vrcdog-releases（VRCDog 本身是私有的）
          owner: KingXiaoTaoOVO
          repo: vrcdog-releases
          releaseCommitish: main
          # 自动合并更新文件以便生成 updater.json
          updaterJsonKeepUniversal: false
