services:
  vrcdog-server:
    build: .
    container_name: vrcdog-server
    restart: unless-stopped
    init: true
    ports:
      - target: 11451
        published: "${VRCDOG_BIND_PORT:-21451}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      VRCDOG_HOST: 0.0.0.0
      VRCDOG_PORT: 11451
      VRCDOG_DATA_FILE: /app/data/server-state.json
      VRCDOG_SERVER_PASSWORD_BCRYPT: ${VRCDOG_SERVER_PASSWORD_BCRYPT:?Set VRCDOG_SERVER_PASSWORD_BCRYPT in .env}
      RUST_LOG: ${RUST_LOG:-vrcdog_server=info,tower_http=info}
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:11451/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
