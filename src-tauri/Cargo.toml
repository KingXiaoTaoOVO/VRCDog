[package]
name = "VrcDog"
version = "5.0.0"
description = "VRC狗狗加速"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "cookies", "json"], default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
futures-util = "0.3"
winreg = "0.52"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
sysinfo = "0.38.4"
rosc = "0.11.4"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.9", features = ["cors"] }
tokio-util = "0.7"
openvr = "0.9"
image = "0.25"
ab_glyph = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rust-ini = "0.21.3"
urlencoding = "2.1.3"
openvr_sys = "2.1.4"
md5 = "0.8.0"
futures = "0.3.32"
tauri-plugin-shell = "2.3.5"
regex = "1.12.3"
tauri-plugin-updater = "2.10.1"
