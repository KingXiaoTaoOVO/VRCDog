[package]
name = "VrcDog"
version = "5.4.2"
description = "VRCDog"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
openvr_sys = { path = "../vendor/openvr_sys" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "cookies", "json", "multipart"], default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "net", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", features = ["ring", "tls12"] }
rustls = { version = "0.23", features = ["ring", "std"] }
webpki-roots = "0.26"
flate2 = "1"
brotli = "8"
winreg = "0.52"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
sysinfo = "0.38.4"
rosc = "0.11.4"
base64 = "0.22"
bcrypt = "0.15"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.9", features = ["cors"] }
tokio-util = "0.7"
openvr = "0.9"
image = "0.25"
qrcode = "0.14"
ab_glyph = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rust-ini = "0.21.3"
urlencoding = "2.1.3"
url = "2"
openvr_sys = "2.1.4"
md5 = "0.8.0"
futures = "0.3.32"
tauri-plugin-shell = "2.3.5"
regex = "1.12.3"
tauri-plugin-updater = "2.10.1"
lazy_static = "1.4"
hostname = "0.4"
midly = "0.5"
midir = "0.9"
btleplug = { version = "0.11" }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# ─── Remote Assist (Native Remote Desktop) ────────────────────────────────────
# Screen capture via DXGI Desktop Duplication
scrap = "0.5"
# Encryption for secure tunnel
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Protobuf for wire protocol (compatible with rendezvous servers)
prost = "0.13"
# UUID for session IDs
# Async channels for internal communication
flume = "0.11"
# LZ4 compression for screen frames
lz4_flex = "0.11"
# Windows APIs for advanced screen capture & input
[target.'cfg(target_os = "windows")'.dependencies]
  windows = { version = "0.58", features = [
      "Win32_Foundation",
      "Win32_Graphics_Gdi",
      "Win32_Graphics_Dxgi",
      "Win32_Graphics_Dxgi_Common",
      "Win32_Graphics_Direct3D11",
      "Win32_UI_Input_KeyboardAndMouse",
      "Win32_UI_WindowsAndMessaging",
      "Win32_System_Threading",
      "Win32_System_SystemInformation",
      "Win32_Storage_FileSystem",
      "Win32_Security",
      "Win32_System_Com",
  ] }
